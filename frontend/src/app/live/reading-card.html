<mat-card appearance="outlined" class="reading-surface">
  <button
    matRipple
    class="reading-card"
    type="button"
    (click)="selected.emit(tag())"
    [class.featured]="featured()"
    [class.iaq]="tag().tag_key === 'iaq'"
    [class.temperature]="tag().tag_key === 'temperature_c'"
    [class.humidity]="tag().tag_key === 'humidity_percent'"
    [class.bad-reading]="tag().reading?.quality === 2"
    [style.background-color]="assessment()?.background ?? null"
    [attr.aria-label]="
      tag().name +
      ': ' +
      displayValue(tag()) +
      ' ' +
      displayUnit(tag()) +
      '. Data quality: ' +
      qualityLabel(tag().reading?.quality) +
      (assessment() ? '. Value: ' + assessment()!.label : '') +
      '. View details.'
    "
  >
    <span class="card-heading">
      <span class="metric-name">{{ label() }}</span>
      <span
        class="quality"
        [attr.data-tone]="qualityTone(tag().reading?.quality)"
        [title]="'Data quality: ' + qualityLabel(tag().reading?.quality)"
      >
        <span class="dot" aria-hidden="true"></span
        ><span
          >Data<span class="quality-text">: {{ qualityLabel(tag().reading?.quality) }}</span></span
        >
      </span>
    </span>
    @if (featured()) {
      <span class="feature-body">
        @if (tag().tag_key === 'iaq' || tag().tag_key === 'humidity_percent') {
          <span class="gauge-display">
            <app-telemetry-gauge
              [value]="tag().reading?.value"
              [max]="tag().tag_key === 'iaq' ? 500 : 100"
              [label]="tag().name"
              [style.--gauge-color]="assessment()?.color ?? null"
            />
            <span class="measurement"
              ><span>{{ displayValue(tag()) }}</span
              ><span class="unit">{{ tag().reading ? displayUnit(tag()) : '' }}</span></span
            >
          </span>
        } @else {
          <span class="temperature-reading">
            <svg
              class="thermometer"
              [style.color]="assessment()?.color"
              viewBox="0 0 24 48"
              aria-hidden="true"
            >
              <path d="M8 29V8a4 4 0 0 1 8 0v21a9 9 0 1 1-8 0Z" />
              <path d="M12 14v22" />
              <circle cx="12" cy="37" r="3" />
            </svg>
            <span class="measurement"
              ><span>{{ displayValue(tag()) }}</span
              ><span class="unit">{{ tag().reading ? displayUnit(tag()) : '' }}</span></span
            >
          </span>
        }
      </span>
      <span class="context">
        @if (assessment(); as state) {
          <span class="value-classification" [style.color]="state.color" [title]="state.reason">{{
            state.label
          }}</span>
        }
      </span>
    } @else {
      <span class="measurement"
        ><span>{{ displayValue(tag()) }}</span
        ><span class="unit">{{ tag().reading ? displayUnit(tag()) : '' }}</span></span
      >
      @if (assessment(); as state) {
        <span class="value-classification" [style.color]="state.color" [title]="state.reason">{{
          state.label
        }}</span>
      }
    }
    <span class="card-footer">
      <span [title]="observedTime(tag().reading?.observed_at) + ' · Asia/Taipei'">{{
        readingAge(tag().reading?.observed_at, now())
      }}</span>
      <span class="detail-cue" aria-hidden="true">↗</span>
    </span>
  </button>
</mat-card>
