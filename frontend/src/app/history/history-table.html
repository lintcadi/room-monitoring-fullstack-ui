<table
  [class.multiple]="tags().length > 1"
  mat-table
  [dataSource]="rows()"
  aria-label="Loaded history readings"
>
  <ng-container matColumnDef="observed">
    <th mat-header-cell *matHeaderCellDef>Observed · Taipei</th>
    <td mat-cell *matCellDef="let row">
      <time
        [attr.datetime]="row.observed_at"
        [title]="'Observed: ' + row.observed_at + '; ingested: ' + row.ingested_at"
        >{{ observedTime(row.observed_at) }}</time
      >
    </td>
  </ng-container>
  <ng-container matColumnDef="measurement">
    <th mat-header-cell *matHeaderCellDef>Measurement</th>
    <td mat-cell *matCellDef="let row">{{ tagMap().get(row.tag_id)?.name }}</td>
  </ng-container>
  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef>Value</th>
    <td
      mat-cell
      *matCellDef="let row"
      [title]="'Raw value: ' + row.value + ' ' + (tagMap().get(row.tag_id)?.unit ?? '')"
    >
      {{ value(row) }} <small>{{ unit(row) }}</small>
    </td>
  </ng-container>
  <ng-container matColumnDef="quality">
    <th mat-header-cell *matHeaderCellDef>Quality</th>
    <td mat-cell *matCellDef="let row">
      <span class="badge" [attr.data-tone]="qualityTone(row.quality)">{{
        qualityLabel(row.quality)
      }}</span>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns()"></tr>
  <tr mat-row *matRowDef="let row; columns: columns()"></tr>
</table>
<mat-paginator
  [length]="readings().length"
  [pageSize]="pageSize()"
  [pageIndex]="current()"
  [hidePageSize]="true"
  (page)="page.set($event.pageIndex)"
  aria-label="Pages of loaded readings"
/>
