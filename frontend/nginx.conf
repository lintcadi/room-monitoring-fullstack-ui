# Docker's embedded DNS lets Nginx follow a recreated backend container.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream telemetry_api {
    zone telemetry_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        # No trailing slash: preserve the backend's /api prefix and query string.
        proxy_pass http://telemetry_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliver SSE events immediately and keep idle streams open between pings.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Missing assets must return 404 rather than the Angular HTML document.
    location ~* \.(?:js|css|svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
